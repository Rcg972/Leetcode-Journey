name: LeetCode Sync

on:
  workflow_dispatch: # Mengizinkan kamu memicu script ini secara manual
  schedule:
    - cron: "0 0 * * *" # Berjalan otomatis setiap hari pada jam 00:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync solutions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: solutions # Opsional: folder tempat kodemu akan disimpan
